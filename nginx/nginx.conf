events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  server {
    listen 80;
    client_max_body_size 200M;

    # Restricted-access mode: uncomment the two lines below and mount
    # nginx/.htpasswd (gitignored — never commit it) to protect every
    # route below with HTTP Basic Auth. See USAGE.md for how to
    # generate .htpasswd and share credentials safely. /health is
    # deliberately left outside this block so uptime checks don't need
    # credentials.
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Health check — always unauthenticated
    location /health { proxy_pass http://backend:8000/health; }

    # API → backend
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 600;
    }

    # Docs
    location /docs { proxy_pass http://backend:8000/docs; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    # WebSocket
    location /ws/ {
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Frontend → SPA
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
    }
  }
}
